<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CyberShield – Analyseur de mot de passe</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>CyberShield</h1>
    <p>Analyseur de robustesse de mot de passe</p>
    <a href="index.html" class="btn">← Retour au dashboard</a>
  </header>

  <main class="dashboard">
    <section class="card" style="max-width: 600px;">
      <h2>Testez votre mot de passe</h2>

      <label for="password-input">Mot de passe à analyser</label>
      <input
        type="password"
        id="password-input"
        placeholder="Tapez votre mot de passe..."
        autocomplete="off"
      >

      <!-- Barre de progression -->
      <div id="strength-bar-wrapper">
        <div id="strength-bar"></div>
      </div>
      <p id="strength-label">Score : 0</p>
      <p> Pour information, un bon mot de passe a une moyenne de 80 de score. </p>

      <!-- Détails de l'analyse -->
      <ul id="password-details">
        <li id="entropy-critere">Entropie estimée : 0 bits</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>© 2026 SecureNova – Projet CyberShield</p>
  </footer>

  <!-- JS global + module mot de passe -->
  <script src="../js/app.js"></script>
  <script src="../js/password.js"></script>
</body>
</html>
